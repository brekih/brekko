<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brekkó klukka</title>
  <style>
    :root {
      --red: #8c2d20;
      --green: #365b50;
      --dark: #321d18;
      --tick: #9b7869;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: transparent;
      color: var(--dark);
    }

    .widget {
      width: 100vw;
      height: 100vh;
      min-height: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2vw, 24px);
      background: linear-gradient(135deg, #fffdf8, #f5eee4);
    }

    .panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: clamp(12px, 2vw, 24px);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 30px rgba(78, 45, 30, 0.14);
    }

    .today {
      color: var(--red);
      font-size: clamp(22px, 4.3vw, 52px);
      font-weight: 800;
      line-height: 1.05;
      text-align: center;
    }

    .date {
      margin-top: 6px;
      color: var(--green);
      font-size: clamp(15px, 2.4vw, 30px);
      font-weight: 650;
      text-align: center;
    }

    .clock {
      position: relative;
      flex: 0 1 auto;
      width: min(70vw, 55vh, 430px);
      aspect-ratio: 1;
      margin: clamp(10px, 2vh, 22px) 0;
      overflow: hidden;
      border: clamp(8px, 1.2vw, 14px) solid var(--red);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 43%, #ffffff 0 62%, #f4e9dd 100%);
      box-shadow: inset 0 0 18px rgba(80, 35, 20, 0.15), 0 7px 19px rgba(80, 35, 20, 0.14);
    }

    #ticks, #numbers {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 2%;
      width: 2px;
      height: 4.2%;
      margin-left: -1px;
      border-radius: 3px;
      background: var(--tick);
      transform-origin: 50% 1142%;
      z-index: 1;
    }

    .tick.major {
      top: 1.5%;
      width: 4px;
      height: 6.2%;
      margin-left: -2px;
      background: var(--red);
      transform-origin: 50% 782%;
    }

    .number {
      position: absolute;
      z-index: 2;
      width: 14%;
      height: 14%;
      display: grid;
      place-items: center;
      color: #562018;
      font-size: clamp(17px, 3.2vw, 34px);
      font-weight: 850;
      line-height: 1;
      transform: translate(-50%, -50%);
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      z-index: 4;
      border-radius: 99px;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: 50% 100%;
    }

    .hour-hand {
      width: clamp(6px, 1.4%, 9px);
      height: 25%;
      background: var(--dark);
    }

    .minute-hand {
      width: clamp(4px, 1%, 6px);
      height: 34%;
      background: #4a4a4a;
    }

    .second-hand {
      width: 2px;
      height: 39%;
      background: #d9362b;
    }

    .centre-pin {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 5;
      width: 6%;
      aspect-ratio: 1;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 2px var(--red);
      transform: translate(-50%, -50%);
    }

    .digital {
      color: var(--red);
      font-size: clamp(30px, 5vw, 62px);
      font-weight: 850;
      line-height: 1;
      letter-spacing: 0.06em;
    }

    @media (max-height: 520px) and (min-aspect-ratio: 5/4) {
      .panel {
        display: grid;
        grid-template-columns: 42% 58%;
        grid-template-rows: auto auto auto;
        column-gap: 18px;
      }
      .today, .date, .digital { grid-column: 1; }
      .today { align-self: end; }
      .date { align-self: center; }
      .digital { align-self: start; text-align: center; }
      .clock {
        grid-column: 2;
        grid-row: 1 / 4;
        width: min(46vw, 88vh, 430px);
        margin: auto;
      }
    }
  </style>
</head>
<body>
  <main class="widget">
    <section class="panel">
      <div class="today" id="todayText"></div>
      <div class="date" id="dateText"></div>

      <div class="clock" aria-label="Hliðræn klukka">
        <div id="ticks" aria-hidden="true"></div>
        <div id="numbers" aria-hidden="true"></div>
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
        <div class="centre-pin"></div>
      </div>

      <div class="digital" id="digitalClock"></div>
    </section>
  </main>

  <script>
    const DAYS = [
      "sunnudagur", "mánudagur", "þriðjudagur", "miðvikudagur",
      "fimmtudagur", "föstudagur", "laugardagur"
    ];

    const MONTHS = [
      "janúar", "febrúar", "mars", "apríl", "maí", "júní",
      "júlí", "ágúst", "september", "október", "nóvember", "desember"
    ];

    function getIcelandNow() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Atlantic/Reykjavik",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return new Date(
        `${values.year}-${values.month}-${values.day}` +
        `T${values.hour}:${values.minute}:${values.second}`
      );
    }

    function buildClock() {
      const ticks = document.getElementById("ticks");
      const numbers = document.getElementById("numbers");

      ticks.replaceChildren();
      numbers.replaceChildren();

      for (let minute = 0; minute < 60; minute++) {
        const tick = document.createElement("div");
        tick.className = minute % 5 === 0 ? "tick major" : "tick";
        tick.style.transform = `rotate(${minute * 6}deg)`;
        ticks.appendChild(tick);
      }

      for (let number = 1; number <= 12; number++) {
        const item = document.createElement("div");
        item.className = "number";

        const angle = (number * 30 - 90) * Math.PI / 180;
        const radius = 38;

        item.style.left = `${50 + radius * Math.cos(angle)}%`;
        item.style.top = `${50 + radius * Math.sin(angle)}%`;
        item.textContent = number;
        numbers.appendChild(item);
      }
    }

    function updateClock() {
      const now = getIcelandNow();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      document.getElementById("todayText").textContent =
        `Í dag er ${DAYS[now.getDay()]}!`;

      document.getElementById("dateText").textContent =
        `${now.getDate()}. ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;

      document.getElementById("digitalClock").textContent =
        `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;

      const secondDegrees = seconds * 6;
      const minuteDegrees = minutes * 6 + seconds * 0.1;
      const hourDegrees = (hours % 12) * 30 + minutes * 0.5 + seconds / 120;

      document.getElementById("secondHand").style.transform =
        `translateX(-50%) rotate(${secondDegrees}deg)`;
      document.getElementById("minuteHand").style.transform =
        `translateX(-50%) rotate(${minuteDegrees}deg)`;
      document.getElementById("hourHand").style.transform =
        `translateX(-50%) rotate(${hourDegrees}deg)`;
    }

    buildClock();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
