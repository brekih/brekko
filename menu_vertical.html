<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#f0b470;
}

.wrapper{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    padding:12px;
}

.card{
    background:#f6c283;
    border-radius:16px;
    padding:15px;
    text-align:center;
}

.day{
    font-size:28px;
    font-weight:700;
    color:#9a2415;
    margin-bottom:10px;
}

.meal{
    font-size:20px;
    font-weight:600;
    color:#9a2415;
    min-height:80px;
    margin-bottom:15px;
}

img{
    width:170px;
    height:170px;
    object-fit:contain;
}

.error{
    color:#9a2415;
    font-size:32px;
    padding:20px;
}
</style>
</head>

<body>

<div class="wrapper" id="menuContainer"></div>

<script>

let menus = [];

async function loadMenus() {

    try {

        const response = await fetch("./data/menu.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("menu.json fannst ekki");
        }

        menus = await response.json();

        renderCurrentWeek();

    } catch(err) {

        console.error(err);

        document.getElementById("menuContainer").innerHTML =
            '<div class="error">Villa við að hlaða matskrá</div>';
    }
}

function todayKey() {

    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0");
}

function currentMenu() {

    const today = todayKey();

    return menus.find(menu =>
        today >= menu.start &&
        today <= menu.end
    );
}

function renderCurrentWeek(){

    const week = currentMenu();
    const target = document.getElementById("menuContainer");

    target.innerHTML = "";

    if(!week){
        target.innerHTML =
            '<div class="error">Engin matskrá fannst</div>';
        return;
    }

    week.days.forEach(day => {

        const card = document.createElement("div");

        card.className = "card";

        const imagePath =
            "./menu_pictures/" +
            (day.image || "placeholder.png");

        card.innerHTML = `
            <div class="day">${day.day}</div>

            <div class="meal">${day.meal}</div>

            <img
                src="${imagePath}"
                alt="${day.day}"
                onerror="this.src='./menu_pictures/placeholder.png'"
            >
        `;

        target.appendChild(card);
    });
}

loadMenus();

</script>

</body>
</html>
