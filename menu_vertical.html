<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#f0b470;
}

.wrapper{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    padding:12px;
}

.card{
    background:#f6c283;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:280px;
}

.day{
    background:#a32018;
    color:white;
    padding:15px;
    font-size:clamp(18px, 2vw, 30px);
    font-weight:700;
    border-top-left-radius:16px;
    border-top-right-radius:16px;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.meal{
    padding:20px;
    color:#9a2415;
    font-size:clamp(14px, 1.5vw, 22px);
    font-weight:600;
    min-height:90px;
    text-align:center;
}

.menu-image{
    height:220px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

.menu-image img{
    width:180px;
    height:150px;
    object-fit:contain;
}

.error{
    color:#9a2415;
    font-size:32px;
    padding:20px;
}
.today-banner{
    margin-top:20px;
    background:#a32018;
    color:#f6c283;
    font-size:48px;
    text-align:center;
    padding:20px;
    border-radius:20px;
    font-weight:300;
}

.food-banner{
    margin-top:12px;
    background:#f6c283;
    color:#a32018;
    font-size:56px;
    text-align:center;
    padding:20px;
    border-radius:20px;
    font-weight:700;
}
.today-wrapper{
    grid-column:1 / -1;
    width:100%;
}

</style>
</head>

<body>

<div class="wrapper" id="menuContainer"></div>

<script>

let menus = [];

async function loadMenus() {

    try {

        const response = await fetch("./data/menu.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("menu.json fannst ekki");
        }

        menus = await response.json();

        renderCurrentWeek();

    } catch(err) {

        console.error(err);

        document.getElementById("menuContainer").innerHTML =
            '<div class="error">Villa við að hlaða matskrá</div>';
    }
}

function todayKey() {

    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0");
}

function currentMenu() {

    const today = todayKey();

    return menus.find(menu =>
        today >= menu.start &&
        today <= menu.end
    );
}

function getTodayInfo() {

    const today = new Date();

    const weekday = today.getDay();

    const dayNames = [
        "Sunnudagur",
        "Mánudagur",
        "Þriðjudagur",
        "Miðvikudagur",
        "Fimmtudagur",
        "Föstudagur",
        "Laugardagur"
    ];

    const week = currentMenu();

    if (!week) {
        return null;
    }

    const mealIndex = weekday - 1;

    return {
        dayName: dayNames[weekday],
        meal:
            mealIndex >= 0 && mealIndex < 5
                ? week.meals[mealIndex]
                : "Enginn skólamatur í dag"
    };
}

function renderCurrentWeek() {

    const week = currentMenu();
    const target = document.getElementById("menuContainer");
    const todayInfo = getTodayInfo();

    target.innerHTML = "";

    if (!week) {
        target.innerHTML =
            '<div class="error">Engin matskrá fannst</div>';
        return;
    }

    const dayNames = [
        "Mánudagur",
        "Þriðjudagur",
        "Miðvikudagur",
        "Fimmtudagur",
        "Föstudagur"
    ];

    week.meals.forEach((meal, index) => {

        const card = document.createElement("div");
        card.className = "card";

        const imagePath =
            "./menu_pictures/" +
            (week.images[index] || "placeholder.png");

        card.innerHTML = `
            <div class="day">
                ${dayNames[index]}
            </div>

            <div class="meal">
                ${meal || ""}
            </div>

            <div class="menu-image">
                <img
                    src="${imagePath}"
                    >
            </div>
               appendChild(card);
               

    });

    if (todayInfo) {

        const todayBanner = document.createElement("div");
        todayBanner.className = "today-wrapper";

        todayBanner.innerHTML = `
            <div class="today-banner">
                Það er ${todayInfo.dayName} í dag!
            </div>

            <div class="food-banner">
                ${todayInfo.meal}
            </div>
        `;

        target.appendChild(todayBanner);
    }
}

loadMenus();

</script>

</body>
</html>
