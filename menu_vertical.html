<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#f0b470;
}

.wrapper{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    padding:12px;
}

.card{
    background:#f6c283;
    border-radius:16px;
    overflow:hidden;
    text-align:center;
}

.day{
    background:#a32018;
    color:white;
    padding:15px;
    margin:-15px -15px 15px -15px;
    font-size:30px;
    font-weight:700;
    border-top-left-radius:16px;
    border-top-right-radius:16px;
}

.meal{
    padding:20px;
    color:#9a2415;
    font-size:24px;
    font-weight:600;
    min-height:90px;
    text-align:center;
}

.menu-image{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.menu-image img{
    max-width:100%;
    max-height:180px;
    object-fit:contain;
}

img{
    width:170px;
    height:170px;
    object-fit:contain;
}

.error{
    color:#9a2415;
    font-size:32px;
    padding:20px;
}
</style>
</head>

<body>

<div class="wrapper" id="menuContainer"></div>

<script>

let menus = [];

async function loadMenus() {

    try {

        const response = await fetch("./data/menu.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("menu.json fannst ekki");
        }

        menus = await response.json();

        renderCurrentWeek();

    } catch(err) {

        console.error(err);

        document.getElementById("menuContainer").innerHTML =
            '<div class="error">Villa við að hlaða matskrá</div>';
    }
}

function todayKey() {

    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0");
}

function currentMenu() {

    const today = todayKey();

    return menus.find(menu =>
        today >= menu.start &&
        today <= menu.end
    );
}

function renderCurrentWeek() {

    const week = currentMenu();

    const target =
        document.getElementById("menuContainer");

    target.innerHTML = "";

    if (!week) {
        target.innerHTML =
            '<div class="error">Engin matskrá fannst</div>';
        return;
    }

    const dayNames = [
        "Mánudagur",
        "Þriðjudagur",
        "Miðvikudagur",
        "Fimmtudagur",
        "Föstudagur"
    ];

    week.meals.forEach((meal, index) => {

        const card =
            document.createElement("div");

        card.className = "card";

        const imagePath =
            "./menu_pictures/" +
            (week.images[index] || "placeholder.png");

        card.innerHTML = `
    <div class="day">
        ${dayNames[index]}
    </div>

    <div class="meal">
        ${meal || ""}
    </div>

    <div class="menu-image">
    <img
        src=${imagePath}
        alt=${meal || "Matur"}
        />
        
    </div>
`;

        target.appendChild(card);
    });
}
function renderCurrentWeek() {

    const week = currentMenu();

    const target =
        document.getElementById("menuContainer");

    target.innerHTML = "";

    if (!week) {
        target.innerHTML =
            '<div class="error">Engin matskrá fannst</div>';
        return;
    }

    const dayNames = [
        "Mánudagur",
        "Þriðjudagur",
        "Miðvikudagur",
        "Fimmtudagur",
        "Föstudagur"
    ];

    week.meals.forEach((meal, index) => {

        const card =
            document.createElement("div");

        card.className = "card";

        const imagePath =
            "./menu_pictures/" +
            (week.images[index] || "placeholder.png");

        card.innerHTML = `
            <div class="day">
                ${dayNames[index]}
            </div>

            <div class="meal">
                ${meal || ""}
            </div>

            ${imagePath}
        `;

        target.appendChild(card);
    });
}

loadMenus();

</script>

</body>
</html>
